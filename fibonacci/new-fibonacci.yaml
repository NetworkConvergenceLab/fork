---
apiVersion: v1
kind: Service
metadata:
  name: cluster-cherry-internal-service
  labels:
    app: cluster-cherry-internal-service
    service: cluster-cherry-internal-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: cluster-cherry-internal-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-cherry-internal-service
  labels:
    account: cluster-cherry-internal-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-cherry-internal-service
  labels:
    app: cluster-cherry-internal-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-cherry-internal-service
  template:
    metadata:
      labels:
        app: cluster-cherry-internal-service
    spec:
      serviceAccountName: cluster-cherry-internal-service
      containers:
      - name: internal-fibonacci-go
        image: 192.168.4.14:443/fork/fibonacci-go:v1
        #image: 192.168.4.14:443/fork/fibonacci-py:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        env:
        - name: PORT
          value: "8000"
        ports:
        - containerPort: 8000
